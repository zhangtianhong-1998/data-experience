version: 0.2.0.dev0
semantic_model:
  - name: bi_device_profit_experiment
    description: >
      由 BI SQL 观察事实导出的可移植语义模型实验；全部指标仍处于 proposed 状态。
    ai_context: >
      只可用于复现已有看板逻辑。不得把单位、币种、含税口径、组织范围或过滤参数解释为已确认事实。
    datasets:
      - name: device_order_profit
        source: >
          SELECT
            c2 AS year_month,
            c7 AS product_l1,
            c10 AS internal_category,
            c27 AS device_order_amount,
            c28 AS device_profit_amount
          FROM dmprjdis_pfa.datain_1783070589517_temp
        description: >
          临时物理表的实验性逻辑映射。字段含义来自重复的 BI 输出别名证据，而非物理元数据确认。
        fields:
          - name: year_month
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: year_month
            dimension:
              is_time: true
            datatype: String
            description: BI 输出别名“年月”；值格式和时区未知。
            ai_context: 同义表达包括“年月”；不可自行转换为财年。
          - name: product_l1
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: product_l1
            dimension:
              is_time: false
            datatype: String
            description: BI 输出别名“产品LV1”，并在查询中作为参数过滤字段。
          - name: internal_category
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: internal_category
            dimension:
              is_time: false
            datatype: String
            description: BI 输出别名“内部分类”。
          - name: device_order_amount
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: device_order_amount
            datatype: Float
            description: SUM(c27) 在 BI 中被命名为“Sum_设备订货”；单位与可加性边界未知。
          - name: device_profit_amount
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: device_profit_amount
            datatype: Float
            description: SUM(c28) 在 BI 中被命名为“Sum_设备利润”；币种、税口径与利润类型未知。
        custom_extensions:
          - vendor_name: BI_SEMANTIC_MINER
            data: '{"status":"proposed","source":"示例表.xlsx","policy":"claims_before_fusion"}'
          - vendor_name: WREN
            data: >
              {"column_types":{"year_month":"VARCHAR","product_l1":"VARCHAR","internal_category":"VARCHAR","device_order_amount":"DOUBLE","device_profit_amount":"DOUBLE"}}
    relationships: []
    metrics:
      - name: total_device_orders
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(device_order_profit.device_order_amount)
        datatype: Float
        description: 复现多条 BI SQL 中的 SUM(c27)，尚非经审批的企业指标。
        ai_context: 中文候选名称为“设备订货”；原看板包含未命名参数过滤条件。
        custom_extensions:
          - vendor_name: BI_SEMANTIC_MINER
            data: '{"status":"proposed","evidence_alias":"Sum_设备订货","negative_knowledge":["currency","unit","scope","filter_parameters"]}'
      - name: total_device_profit
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(device_order_profit.device_profit_amount)
        datatype: Float
        description: 复现多条 BI SQL 中的 SUM(c28)，尚非经审批的企业指标。
        ai_context: 中文候选名称为“设备利润”；禁止推断币种、税口径与利润类型。
        custom_extensions:
          - vendor_name: BI_SEMANTIC_MINER
            data: '{"status":"proposed","evidence_alias":"Sum_设备利润","negative_knowledge":["currency","tax_basis","profit_type","scope"]}'
